<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>capview</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="app">
      <video id="screen" autoplay muted playsinline></video>
      <p id="status" role="status" hidden></p>
      <button id="unlock" type="button" hidden>Clique para ativar o som</button>
      <div id="toast" class="toast" aria-live="polite"></div>
      <div id="browser-hint" class="hint" role="note" hidden>
        <p>
          No Chrome/Edge algumas placas entregam vídeo comprimido. Se a imagem parecer com pouca
          qualidade, abra o capview no <strong>Firefox</strong>.
        </p>
        <button id="browser-hint-close" type="button">Entendi</button>
      </div>
      <div id="controls" class="controls">
        <button id="mute" type="button" aria-label="Mudo" aria-pressed="false" title="Mudo (M)">🔊</button>
        <input id="volume" type="range" min="0" max="200" step="5" value="100" aria-label="Volume" />
        <output id="volume-value" for="volume">100%</output>
        <label>Vídeo <select id="video-device"></select></label>
        <label>Áudio <select id="audio-device"></select></label>
        <span id="mode" class="mode"></span>
        <button id="fullscreen" type="button" title="Tela cheia (F)">Tela cheia</button>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
