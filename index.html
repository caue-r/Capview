<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>capview</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&display=swap"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="app">
      <video id="screen" autoplay muted playsinline></video>

      <div id="status" class="status" role="status" hidden>
        <img class="status-mark" src="./favicon.svg" alt="" width="72" height="72" />
        <p id="status-text"></p>
      </div>

      <button id="unlock" class="unlock" type="button" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /></svg>
        <span>Clique para ativar o som</span>
      </button>

      <div id="toast" class="toast" aria-live="polite"></div>

      <div id="browser-hint" class="hint" role="note" hidden>
        <p>
          No Chrome e no Edge algumas placas entregam vídeo comprimido. Se a imagem parecer com
          pouca qualidade, abra o capview no Firefox.
        </p>
        <button id="browser-hint-close" type="button">Entendi</button>
      </div>

      <div id="controls" class="dock">
        <button id="mute" class="dock-button" type="button" aria-label="Mudo" aria-pressed="false" title="Mudo (M)">
          <svg class="icon icon-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /></svg>
          <svg class="icon icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" /><path d="M16 10l4 4M20 10l-4 4" /></svg>
        </button>
        <input id="volume" class="volume" type="range" min="0" max="200" step="5" value="100" aria-label="Volume" />
        <output id="volume-value" class="volume-value" for="volume">100%</output>

        <span class="dock-divider" aria-hidden="true"></span>

        <button class="dock-button" type="button" popovertarget="source-panel" aria-label="Fonte" title="Fonte">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" /></svg>
        </button>
        <button id="fullscreen" class="dock-button" type="button" aria-label="Tela cheia" title="Tela cheia (F)">
          <svg class="icon icon-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg>
          <svg class="icon icon-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" /></svg>
        </button>

        <div id="source-panel" class="panel" popover>
          <label class="field">
            <span>Vídeo</span>
            <select id="video-device"></select>
          </label>
          <label class="field">
            <span>Áudio</span>
            <select id="audio-device"></select>
          </label>
          <p class="signal">Sinal <span id="mode"></span></p>
        </div>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
